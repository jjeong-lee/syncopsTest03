                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      security: []
  /api/auth/login:
    post:
      operationId: login
      summary: 로그인
      x-related-requirements:
      - REQ-047
      - REQ-061
      - REQ-089
      - REQ-090
      - REQ-091
      responses:
        '200':
          description: 성공 ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CurrentUser'
        '400':
          description: 400 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 401 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 403 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-business-rules:
      - 내부 계정·비밀번호 기반 local AuthenticationPort adapter로만 인증한다
      - user_accounts.system_enabled=false 계정은 로그인할 수 없다
      - 성공 시 HttpOnly SameSite=Lax session cookie를 발급한다
      x-side-effects:
      - sessions row를 ACTIVE 상태로 저장한다
      - session cookie를 응답에 설정한다
      x-state-transitions:
      - absent -> ACTIVE session
      x-required-tests:
      - 'happy: admin/admin credential -> sessions.status ACTIVE row가 생성되고 getCurrentUser가 R09를 반환한다'
      - 'auth: user_accounts.system_enabled=false 계정 -> 403 ApiError를 반환한다'
      - 'validation: password 누락 -> password field error를 반환하고 sessions row가 생성되지 않는다'
      - 'business: 실제 SSO adapter 호출 없이 local AuthenticationPort adapter만 사용 -> 외부 접속 기록이 없어야 한다'
      - 'side-effect: 로그인 성공 -> HttpOnly SameSite=Lax session cookie와 sessions.created_at이 존재한다'
      security: []
  /api/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃
      x-related-requirements:
      - REQ-047
      - REQ-061
      - REQ-070
      responses:
        '200':
          description: 성공 ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 400 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 401 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 403 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      x-business-rules:
      - ACTIVE session cookie가 있어야 logout 처리한다
      - 로그아웃 후 동일 session으로 보호 API를 사용할 수 없다
      x-side-effects:
      - sessions.status를 REVOKED로 갱신한다
      - session cookie 만료 응답을 반환한다
      x-state-transitions:
      - ACTIVE session -> REVOKED
      x-required-tests:
      - 'happy: ACTIVE session cookie -> sessions.status가 REVOKED로 변경되고 getCurrentUser가 401을 반환한다'
      - 'auth: 세션 없는 logout -> 401 ApiError를 반환한다'
      - 'validation: malformed session cookie -> 401 ApiError envelope를 반환한다'
      - 'business: 이미 REVOKED session -> 상태가 REVOKED로 유지되고 새 session이 생성되지 않는다'
      - 'side-effect: logout 성공 -> sessions.updated_at이 갱신된다'
