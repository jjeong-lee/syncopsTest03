      - roleCode는 R01~R09 중 하나여야 한다
      x-side-effects:
      - user_role_assignment row를 ACTIVE/REVOKED로 조정한다
      - change_history에 역할 변경 전후 값을 기록한다
      x-state-transitions:
      - ACTIVE -> REVOKED
      - N/A -> ACTIVE
      x-required-tests:
      - 'happy: 사용자 업무 역할 변경 요청이 성공한다 -> 후속 조회에서 user_role_assignment.status 변경 또는 반환값을 확인한다'
      - 'auth: 권한 없는 역할이 같은 요청을 보낸다 -> ApiError status 401 또는 403을 반환하고 user_role_assignment row는 변경되지 않는다'
      - 'validation: 필수 입력을 누락하거나 enum 밖 값을 보낸다 -> ApiError.fields에 해당 field-level error가 포함된다'
      - 'business: KORUS 원천정보는 직접 수정하지 않고 사용자 역할 배정만 변경한다 -> 도메인 규칙 위반으로 거부되고 user_role_assignment.status 값은 이전 상태를 유지한다'
      - 'side-effect: user_role_assignment row를 ACTIVE/REVOKED로 조정한다 -> change_history 또는 user_session 등 명명된 후속 row를 읽어 확인한다'
