openapi: 3.0.3
info:
  title: 교수업적평가 공통기능 1차 구축 API
  version: 0.1.0
  description: SPEC-REQUEST.md, spec.md, plan.md, tasks.md, Requirement Registry를 기준으로 작성한 HTTP API contract.
servers:
- url: /
  description: frontend nginx reverse proxy 기준 relative /api path
security:
- sessionCookie: []
x-shared-contract-reference:
  backend: Java 17, Spring Boot 3.3.x, Maven, MyBatis, PostgreSQL 16, executable JAR
  frontend: React 18, TypeScript, Vite 5, nginx /api/* reverse proxy
  database: PostgreSQL 16 with Flyway migration and blocking MyBatis persistence
  infrastructure: Docker Compose with backend, frontend, database
  required_outputs:
  - backend
  - frontend
  - infra/docker-compose.yml
  - /api/health
