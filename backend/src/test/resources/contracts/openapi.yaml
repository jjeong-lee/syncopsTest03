openapi: 3.0.3
info:
  title: 교수업적평가 시스템 공통기능 API
  version: 0.1.0
  description: 'Batch 1 설계 산출물: Requirement Registry canonical_id 기반 HTTP API 계약. 문서는 한국어로 작성하고 code identifier/API path/enum/table
    name은 원문을 유지한다.'
servers:
- url: /
  description: nginx reverse proxy 또는 backend base
tags:
- name: Auth
  description: 로그인·세션
- name: System Users
  description: 사용자 관리
- name: Organizations
  description: 조직 관리
- name: Roles
  description: 역할·사용자 역할 관리
- name: Menus
  description: 메뉴·권한 관리
- name: Codes
  description: 공통코드 관리
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 서비스 상태 확인
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/HealthResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      x-no-requirement-reason: 필수 산출물의 health endpoint이며 업무 요구가 아닌 인프라 readiness 확인용 read-only probe이다.
      tags:
      - Health
  /api/auth/login:
    post:
      operationId: login
      summary: 로그인 세션 발급
      responses:
        '400':
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증 세션 없음
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '201':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthMeResponse'
      x-related-requirements:
      - REQ-026
      - REQ-060
      - REQ-074
      - REQ-102
      - REQ-103
      - REQ-104
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-business-rules:
      - 내부 계정 login_id와 password가 일치해야 한다
      - 비활성 app_user.system_enabled=N 계정은 로그인할 수 없다
      - HttpOnly SameSite=Lax 세션 쿠키를 발급해야 한다
      x-side-effects:
      - user_session row를 ACTIVE 상태로 생성한다
      - Set-Cookie로 session_id를 반환한다
      x-state-transitions:
      - N/A -> ACTIVE
      x-required-tests:
      - 'happy: 로그인 세션 발급 요청이 성공한다 -> 후속 조회에서 user_session.status 변경 또는 반환값을 확인한다'
      - 'auth: 권한 없는 역할이 같은 요청을 보낸다 -> ApiError status 401 또는 403을 반환하고 user_session row는 변경되지 않는다'
      - 'validation: 필수 입력을 누락하거나 enum 밖 값을 보낸다 -> ApiError.fields에 해당 field-level error가 포함된다'
      - 'business: 내부 계정 login_id와 password가 일치해야 한다 -> 도메인 규칙 위반으로 거부되고 user_session.status 값은 이전 상태를 유지한다'
      - 'side-effect: user_session row를 ACTIVE 상태로 생성한다 -> change_history 또는 user_session 등 명명된 후속 row를 읽어 확인한다'
      tags:
      - Auth
  /api/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃 세션 회수
      responses:
        '400':
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증 세션 없음
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '201':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LogoutResponse'
      security: &id001
      - sessionCookie: []
      x-related-requirements:
      - REQ-060
      - REQ-074
      - REQ-083
      x-business-rules:
      - 현재 인증 세션이 ACTIVE 상태여야 한다
      - 이미 만료 또는 회수된 세션은 성공 응답하되 ACTIVE row를 새로 만들지 않는다
      x-side-effects:
      - 현재 user_session.status를 REVOKED로 변경한다
      x-state-transitions:
      - ACTIVE -> REVOKED
      x-required-tests:
      - 'happy: 로그아웃 세션 회수 요청이 성공한다 -> 후속 조회에서 user_session.status 변경 또는 반환값을 확인한다'
      - 'auth: 권한 없는 역할이 같은 요청을 보낸다 -> ApiError status 401 또는 403을 반환하고 user_session row는 변경되지 않는다'
      - 'validation: 필수 입력을 누락하거나 enum 밖 값을 보낸다 -> ApiError.fields에 해당 field-level error가 포함된다'
      - 'business: 현재 인증 세션이 ACTIVE 상태여야 한다 -> 도메인 규칙 위반으로 거부되고 user_session.status 값은 이전 상태를 유지한다'
      - 'side-effect: 현재 user_session.status를 REVOKED로 변경한다 -> change_history 또는 user_session 등 명명된 후속 row를 읽어 확인한다'
      tags:
      - Auth
      x-roles:
      - authenticated
  /api/auth/me:
    get:
      operationId: getCurrentUser
      summary: 현재 사용자 조회
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthMeResponse'
        '400':
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증 세션 없음
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 권한 없음
          content:
