      schema:
        type: string
      description: field,direction format
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          nullable: true
        error:
          nullable: true
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
      required:
      - success
      - timestamp
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - code
      - message
