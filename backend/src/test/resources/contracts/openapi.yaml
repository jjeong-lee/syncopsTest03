              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      security: *id001
      x-related-requirements:
      - REQ-026
      - REQ-060
      - REQ-074
      - REQ-083
      - REQ-104
      tags:
      - Auth
      x-roles:
      - authenticated
  /api/users:
