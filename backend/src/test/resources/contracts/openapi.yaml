      - 'business: operation의 x-business-rules 위반 -> session_termination_history의 기존 상태가 유지된다'
      - 'side-effect: 성공 요청 처리 -> 성공 후 session_termination_history에 LOGOUT 종료유형을 기록한다 행이 생성되거나 조회 가능해야 한다'
      x-state-transitions:
      - ACTIVE -> LOGGED_OUT
      responses:
        '200':
