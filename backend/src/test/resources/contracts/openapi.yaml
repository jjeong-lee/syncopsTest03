openapi: 3.0.3
info:
  title: 교수업적평가 공통기능 1차 API
  version: 0.1.0
  description: '한국교원대학교 교수업적평가시스템 공통기능 1차 완료 목표의 canonical HTTP API contract다.

    모든 보호 API는 인증 세션을 요구하고, 모든 JSON 2xx/4xx 응답은 ApiResponse envelope을 사용한다.

    '
servers:
- url: /api
  description: frontend nginx reverse proxy를 통한 상대경로
security:
- SessionCookie: []
tags:
- name: health
  description: 상태 확인
- name: auth
  description: 인증과 세션
- name: users
  description: 사용자 관리
- name: organizations
  description: 조직 관리
- name: roles
  description: 역할 관리
- name: user-roles
  description: 사용자 역할 관리
- name: menus
  description: 메뉴 관리
- name: menu-permissions
  description: 메뉴 권한 관리
- name: code-groups
  description: 코드그룹 관리
- name: detail-codes
  description: 상세코드 관리
paths:
  /health:
    get:
      tags:
      - health
      operationId: getHealth
      summary: 상태 확인
      security: []
      x-related-requirements:
      - REQ-001
      - REQ-017
      responses:
        '200':
          description: backend 상태가 정상이다.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/HealthStatus'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/login:
    post:
      tags:
      - auth
      operationId: login
      summary: 로그인
      security: []
      x-related-requirements:
      - REQ-012
      - REQ-019
      - REQ-023
      x-related-fr:
      - FR-011
      - FR-017
      x-business-rules:
      - 내부 계정과 비밀번호로 인증하며 실제 SSO는 AuthenticationPort 뒤의 후속 Adapter로 남긴다.
      - 성공 시 HttpOnly SameSite=Lax 세션 쿠키를 발급한다.
      - 비활성 또는 잠긴 계정은 로그인할 수 없다.
      - 시드 관리자 계정 admin/admin은 Docker Compose 실행 직후 로그인 가능해야 한다.
      x-side-effects:
      - user_session 레코드를 ACTIVE 상태로 저장한다.
      - 인증 실패 또는 성공 이벤트를 request_id와 함께 구조화 로그로 기록한다.
      x-state-transitions:
      - user_session 없음 -> ACTIVE
      x-required-tests:
      - admin/admin 로그인 성공과 current user R09 확인 테스트
      - 비활성 계정 로그인 실패 401 테스트
      - Set-Cookie HttpOnly SameSite=Lax 검증 테스트
      - 'happy: verify login contract'
      - 'auth: verify login contract'
      - 'validation: verify login contract'
      - 'business: verify login contract'
      - 'side-effect: verify login contract'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly SameSite=Lax session cookie
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      summary: 로그아웃
      x-related-requirements:
      - REQ-012
      - REQ-019
      x-business-rules:
      - 현재 ACTIVE 세션만 로그아웃 대상이다.
      - 로그아웃 이후 같은 세션으로 보호 API를 호출하면 401로 차단한다.
      x-side-effects:
      - user_session.session_status를 REVOKED로 변경한다.
      - 세션 쿠키 만료 응답을 반환한다.
      x-state-transitions:
      - ACTIVE -> REVOKED
      x-required-tests:
      - 로그아웃 후 current user 401 테스트
      - 'happy: verify logout contract'
      - 'auth: verify logout contract'
      - 'validation: verify logout contract'
      - 'business: verify logout contract'
      - 'side-effect: verify logout contract'
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/EmptyApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/me:
    get:
      tags:
      - auth
      operationId: getCurrentUser
      summary: 현재 사용자
      x-related-requirements:
      - REQ-012
      - REQ-019
      - REQ-023
      responses:
        '200':
          description: 현재 인증 사용자와 역할
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /users:
    get:
      tags:
      - users
      operationId: listUsers
      summary: 사용자 목록
      x-related-requirements:
      - REQ-002
      - REQ-013
      - REQ-021
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      - name: employeeNo
        in: query
        schema:
          type: string
        description: 교번 검색
      - name: name
        in: query
        schema:
          type: string
        description: 성명 검색
      - name: organizationCode
        in: query
        schema:
          type: string
        description: 소속 조직코드 검색
      - name: jobGrade
        in: query
        schema:
          type: string
        description: 직급 검색
      - name: employmentStatus
        in: query
        schema:
          $ref: '#/components/schemas/EmploymentStatus'
      - name: roleCode
        in: query
        schema:
          $ref: '#/components/schemas/RoleCode'
      - name: systemUseYn
        in: query
        schema:
          $ref: '#/components/schemas/Yn'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: filter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 사용자 검색 결과
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /users/{userId}/usage:
    patch:
      tags:
      - users
      operationId: updateUserUsage
      summary: 사용자 사용여부 변경
      x-related-requirements:
      - REQ-002
      - REQ-013
      - REQ-014
      - REQ-021
      x-related-fr:
      - FR-002
      - FR-013
      x-business-rules:
      - KORUS 원천 필드는 직접 수정하지 않는다.
      - 로컬 user_account의 system_use_yn과 account_status만 변경한다.
      - 권한 있는 관리자만 사용여부를 변경할 수 있다.
      x-side-effects:
      - user_account의 system_use_yn, account_status, updated_at을 저장한다.
      - 관리자 변경 작업을 request_id와 함께 구조화 로그로 기록한다.
      x-state-transitions:
      - ACTIVE -> DISABLED
      - DISABLED -> ACTIVE
      x-required-tests:
      - KORUS snapshot 필드 불변 검증 테스트
      - 비권한 사용자 403 테스트
      - 변경 후 사용자 목록 재조회 테스트
      - 'happy: verify updateUserUsage contract'
      - 'auth: verify updateUserUsage contract'
      - 'validation: verify updateUserUsage contract'
      - 'business: verify updateUserUsage contract'
      - 'side-effect: verify updateUserUsage contract'
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUsageUpdateRequest'
      responses:
        '200':
          description: 사용자 사용여부 변경 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /organizations:
    get:
      tags:
      - organizations
      operationId: listOrganizations
      summary: 조직 목록
      x-related-requirements:
      - REQ-003
      - REQ-013
      - REQ-021
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      - name: organizationCode
        in: query
        schema:
          type: string
      - name: organizationName
        in: query
        schema:
          type: string
      - name: organizationType
        in: query
        schema:
          $ref: '#/components/schemas/OrganizationType'
      - name: effectiveDate
        in: query
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: filter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 조직 목록
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OrganizationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /organizations/tree:
    get:
      tags:
      - organizations
      operationId: getOrganizationTree
      summary: 조직 계층
      x-related-requirements:
      - REQ-003
      - REQ-021
      parameters:
      - name: effectiveDate
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 조직 계층
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/OrganizationNode'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /organizations/{organizationCode}/relation:
    put:
      tags:
      - organizations
      operationId: updateOrganizationRelation
      summary: 조직 관계 변경
      x-related-requirements:
      - REQ-003
      - REQ-014
      - REQ-021
      x-related-fr:
      - FR-003
      x-business-rules:
      - 조직 관계의 적용 시작일과 종료일은 겹칠 수 없다.
      - 종료일은 시작일보다 빠를 수 없다.
      - 기존 상위조직 관계 이력은 보존한다.
      x-side-effects:
      - organization의 parent_organization_code와 적용기간 정보를 저장한다.
      - 이전 관계를 ENDED 상태로 보존하고 새 관계 적용 정보를 기록한다.
      - 관리자 변경 작업을 request_id와 함께 구조화 로그로 기록한다.
      x-state-transitions:
      - ACTIVE -> ENDED
      - 신규 관계 없음 -> ACTIVE
      x-required-tests:
      - 기간 overlap 400 또는 409 검증 테스트
      - 관계 변경 후 계층 재조회 테스트
      - 'happy: verify updateOrganizationRelation contract'
      - 'auth: verify updateOrganizationRelation contract'
      - 'validation: verify updateOrganizationRelation contract'
      - 'business: verify updateOrganizationRelation contract'
      - 'side-effect: verify updateOrganizationRelation contract'
      parameters:
      - name: organizationCode
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRelationRequest'
      responses:
        '200':
          description: 조직 관계 변경 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '409':
          $ref: '#/components/responses/Conflict'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /roles:
    get:
      tags:
      - roles
      operationId: listRoles
      summary: 역할 목록
      x-related-requirements:
      - REQ-004
      - REQ-011
      - REQ-021
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      - name: roleCode
        in: query
        schema:
          $ref: '#/components/schemas/RoleCode'
      - name: useYn
        in: query
        schema:
          $ref: '#/components/schemas/Yn'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: filter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 역할 목록
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/RolePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags:
      - roles
      operationId: createRole
      summary: 역할 등록
      x-related-requirements:
      - REQ-004
      - REQ-011
      - REQ-014
      - REQ-021
      x-business-rules:
      - 역할코드는 R01~R09 체계와 중복 금지 규칙을 따른다.
      - 역할 목적, 부여 기준, 데이터 범위 기본값을 함께 관리한다.
      - 역할명 변경 가능성과 별개로 role_code는 안정 식별자로 보존한다.
      x-side-effects:
      - role 레코드를 생성한다.
      - 관리자 변경 작업을 request_id와 함께 구조화 로그로 기록한다.
      x-required-tests:
      - 중복 role_code 409 테스트
      - role_code와 role_name 구분 저장 테스트
      - 'happy: verify createRole contract'
      - 'auth: verify createRole contract'
      - 'validation: verify createRole contract'
      - 'business: verify createRole contract'
      - 'side-effect: verify createRole contract'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '201':
          description: 역할 등록 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '409':
          $ref: '#/components/responses/Conflict'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /roles/{roleCode}:
    patch:
      tags:
      - roles
      operationId: updateRole
      summary: 역할 수정
      x-related-requirements:
      - REQ-004
      - REQ-011
      - REQ-014
      - REQ-021
      x-business-rules:
      - role_code는 변경할 수 없다.
      - role_name, role_purpose, assignment_criteria, default_data_scope, use_yn만 수정 가능하다.
      - 비활성 역할은 신규 권한 산정에서 제외한다.
      x-side-effects:
      - role의 관리 필드와 updated_at을 저장한다.
      - 관리자 변경 작업을 request_id와 함께 구조화 로그로 기록한다.
      x-state-transitions:
      - ACTIVE -> DISABLED
      - DISABLED -> ACTIVE
      x-required-tests:
      - 역할명 변경 후 role_code 유지 테스트
      - 비활성 역할 권한 차단 테스트
      - 'happy: verify updateRole contract'
      - 'auth: verify updateRole contract'
      - 'validation: verify updateRole contract'
      - 'business: verify updateRole contract'
      - 'side-effect: verify updateRole contract'
      parameters:
      - $ref: '#/components/parameters/RoleCodeParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '200':
          description: 역할 수정 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
          content:
            application/json:
