    post:
      operationId: logout
      summary: 로그아웃
      tags:
      - 인증
      x-related-requirements:
      - REQ-283
      - REQ-218
      - REQ-219
      - REQ-220
      - REQ-221
      - REQ-249
      - REQ-278
      x-business-rules:
      - 인증된 현재 세션만 로그아웃할 수 있다
      x-side-effects:
      - session_termination_history에 LOGOUT 종료유형을 기록한다
      x-required-tests:
      - 'happy: 유효한 로그아웃 요청 -> session_termination_history.state field 값이 후속 조회에서 변경되어 보인다'
      - 'auth: 권한 없는 역할 또는 미인증 세션 -> 401 또는 403 ApiError를 반환하고 session_termination_history 행을 변경하지 않는다'
