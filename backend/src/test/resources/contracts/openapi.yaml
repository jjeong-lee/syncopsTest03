                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      security: *id001
      x-related-requirements:
      - REQ-018
      - REQ-019
      - REQ-024
      - REQ-029
      - REQ-075
      - REQ-083
      - REQ-084
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserUsageRequest'
      x-business-rules:
      - KORUS staff snapshot field는 수정하지 않고 app_user.system_enabled만 변경한다
      - systemEnabled는 Y 또는 N이어야 한다
      x-side-effects:
      - app_user.system_enabled를 변경한다
      - change_history에 app_user 변경 전후 값을 기록한다
      x-state-transitions:
      - Y -> N
      - N -> Y
      x-required-tests:
      - 'happy: 사용자 사용여부 변경 요청이 성공한다 -> 후속 조회에서 app_user.system_enabled 변경 또는 반환값을 확인한다'
      - 'auth: 권한 없는 역할이 같은 요청을 보낸다 -> ApiError status 401 또는 403을 반환하고 app_user row는 변경되지 않는다'
      - 'validation: 필수 입력을 누락하거나 enum 밖 값을 보낸다 -> ApiError.fields에 해당 field-level error가 포함된다'
      - 'business: KORUS staff snapshot field는 수정하지 않고 app_user.system_enabled만 변경한다 -> 도메인 규칙 위반으로 거부되고 app_user.system_enabled
        값은 이전 상태를 유지한다'
      - 'side-effect: app_user.system_enabled를 변경한다 -> change_history 또는 user_session 등 명명된 후속 row를 읽어 확인한다'
      tags:
      - System Users
      x-roles:
      - authenticated
