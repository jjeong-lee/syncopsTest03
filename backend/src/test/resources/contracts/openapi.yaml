openapi: 3.0.3
info:
  title: 교수업적평가시스템 공통기능 API
  version: 0.1.0
  description: Batch 1 HTTP API 계약이다. Java 17 + Spring Boot 3.3.x + MyBatis blocking + PostgreSQL 16 계약을 따른다.
servers:
- url: /
  description: 경로 자체가 /api/... 상대경로를 포함한다
security:
- sessionCookie: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 서비스 상태 조회
      x-related-requirements:
      - REQ-084
      responses:
        '200':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        status:
                          type: string
        '400':
          description: 400 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 401 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 403 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
  /api/auth/login:
    post:
      operationId: loginUser
      summary: 시드 관리자 로그인
      x-related-requirements:
      - REQ-048
      - REQ-067
      - REQ-068
      - REQ-069
      responses:
        '200':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CurrentUser'
        '400':
          description: 400 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 401 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 403 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-business-rules:
      - login_id와 password는 비어 있을 수 없다
      - 시드 관리자 admin은 R09 역할을 가진다
      x-side-effects:
      - user_session 레코드를 ACTIVE로 저장한다
      - HttpOnly SameSite=Lax session cookie를 발급한다
      x-required-tests:
      - 'happy: 유효한 요청 -> user_session.status 재조회 값이 요청 값과 일치한다'
      - 'auth: 세션 없는 사용자 -> 401 ApiError를 반환한다'
      - 'validation: password 누락 -> 해당 fieldErrors 항목을 반환한다'
      - 'business: 비활성 app_user는 로그인 차단 -> user_session 기존 상태가 변경되지 않는다'
      - 'side-effect: user_session -> change_history 행이 생성된다'
      x-state-transitions:
      - none -> ACTIVE
  /api/auth/logout:
    post:
      operationId: logoutUser
      summary: 세션 로그아웃
      x-related-requirements:
      - REQ-048
      responses:
        '200':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
        '400':
          description: 400 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 401 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 403 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      security:
      - sessionCookie: []
      x-business-rules:
      - ACTIVE 세션만 로그아웃할 수 있다
      x-side-effects:
      - user_session.status를 REVOKED로 저장한다
      - session cookie를 만료시킨다
      x-required-tests:
      - 'happy: 유효한 요청 -> user_session.status 재조회 값이 요청 값과 일치한다'
      - 'auth: 세션 없는 사용자 -> 401 ApiError를 반환한다'
      - 'validation: session_id 없음 -> 해당 fieldErrors 항목을 반환한다'
      - 'business: 이미 REVOKED 세션은 중복 변경 차단 -> user_session 기존 상태가 변경되지 않는다'
      - 'side-effect: user_session -> change_history 행이 생성된다'
      x-state-transitions:
      - ACTIVE -> REVOKED
      x-roles:
      - authenticated
