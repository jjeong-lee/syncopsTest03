components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: HttpOnly SameSite=Lax session cookie. 로컬 HTTP Docker profile에서는 Secure=false, 운영 TLS profile에서는 Secure=true.
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: 0부터 시작하는 페이지 번호
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        enum:
        - 20
