                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      security: *id001
      x-related-requirements:
      - REQ-018
      - REQ-027
      - REQ-028
      - REQ-075
      - REQ-083
      - REQ-084
      parameters:
      - name: staffNo
        in: query
        schema:
          type: string
        description: 교번
      - name: name
        in: query
        schema:
          type: string
        description: 성명
      - name: orgCode
        in: query
        schema:
          type: string
        description: 소속
      - name: rankName
        in: query
        schema:
          type: string
        description: 직급
      - name: employmentStatus
        in: query
        schema:
          type: string
        description: 재직상태
      - name: roleCode
        in: query
        schema:
          type: string
        description: 역할
      - name: systemEnabled
        in: query
        schema:
          type: string
        description: 사용여부 Y/N
      - &id002
        name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: 0 기반 page index
      - &id003
        name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        description: page size
      - &id004
        name: sort
        in: query
        schema:
          type: string
        description: '정렬 필드와 방향, 예: displayOrder,asc'
      - name: filter
        in: query
        required: false
        schema:
          type: string
      tags:
      - System Users
      x-roles:
      - authenticated
  /api/users/{userId}:
    get:
      operationId: getUser
