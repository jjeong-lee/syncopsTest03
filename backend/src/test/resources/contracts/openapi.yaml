openapi: 3.0.3
info:
  title: 교수업적평가 시스템 공통기능 API
  version: 001-feature
  description: Batch 1 design-stage HTTP API contract. 모든 설명은 한국어이며 code identifiers/API paths/table names/enum values는 원문을 유지한다.
servers:
- url: /
  description: frontend nginx reverse proxy 기준 상대경로
security:
- sessionCookie: []
paths:
  /api/health:
    get:
      operationId: healthCheck
      summary: 상태 확인
      tags:
      - 공통기능
      x-no-requirement-reason: /api/health는 필수 산출물 검증용 infrastructure health probe이며 특정 업무 요구사항의 조회·변경을 수행하지 않는다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data: {}
        '400':
          description: 검증 실패
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
  /api/auth/login:
    post:
      operationId: login
      summary: 로그인
      tags:
      - 인증
      x-related-requirements:
      - REQ-283
      - REQ-326
      - REQ-327
      - REQ-328
      - REQ-223
      - REQ-231
      - REQ-249
      - REQ-254
      - REQ-277
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-business-rules:
      - 로컬 DB 기반 내부 계정만 인증한다
      - admin/admin seed 계정은 Docker Compose 실행 직후 로그인 가능해야 한다
      - 일정 시간 미사용 시 세션 자동 만료 정책을 적용한다
      x-side-effects:
      - session 레코드를 ACTIVE 상태로 생성하고 동일 계정 중복 접속은 audit_log에 기록한다
      x-required-tests:
      - 'happy: 유효한 로그인 요청 -> session.state field 값이 후속 조회에서 변경되어 보인다'
      - 'auth: 권한 없는 역할 또는 미인증 세션 -> 401 또는 403 ApiError를 반환하고 session 행을 변경하지 않는다'
      - 'validation: 필수 식별자 또는 사유 누락 -> 해당 필드 오류가 ApiError.fieldErrors에 포함된다'
      - 'business: operation의 x-business-rules 위반 -> session의 기존 상태가 유지된다'
      - 'side-effect: 성공 요청 처리 -> 성공 후 session 레코드를 ACTIVE 상태로 생성하고 동일 계정 중복 접속은 audit_log에 기록한다 행이 생성되거나 조회 가능해야 한다'
      x-state-transitions:
      - 없음 -> ACTIVE
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Session'
        '400':
          description: 검증 실패
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Session'
