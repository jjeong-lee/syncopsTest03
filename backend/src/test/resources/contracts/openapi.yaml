paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 서비스 상태 확인
      x-related-requirements:
      - REQ-115
      responses:
        '200':
          description: 성공 ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Health'
        '400':
          description: 400 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 401 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 403 ApiError envelope
          content:
            application/json:
              schema:
                allOf:
