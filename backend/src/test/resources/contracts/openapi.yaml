openapi: 3.0.3
info:
  title: 교수업적평가 공통기능 1차 API
  version: 0.1.0
  description: REQ-001~REQ-028 Requirement Registry 기반 HTTP API 계약. 파일 upload/download API는 REQ-011 제외 범위이므로 1차 계약에 포함하지 않는다.
x-shared-contract-reference:
  technology_stack:
    Frontend: React + TypeScript + Vite
    Backend: Java 17 + Spring Boot
    Database: PostgreSQL
    Infrastructure: Docker Compose
  version_bom:
    spring_boot: 3.3.x
    node: 20.x
    vite: 5.x
    react: 18.x
    postgres: 16.x
  required_outputs:
    backend_dir: backend
    frontend_dir: frontend
    compose_file: infra/docker-compose.yml
    health_endpoint: /api/health
  execution_persistence_contract:
    decision_status: resolved
    execution_model: imperative
    persistence_technology: mybatis
    access_mode: blocking
x-uncovered-requirements:
- canonical_id: REQ-011
  status: out-of-scope
  evidence: 제외 범위 기능은 업무 API operation으로 매핑하지 않고 ScopeBoundaryTest 대상에 둔다.
- canonical_id: REQ-013
  status: data-constraint
  evidence: 변경 추적은 change_history table side-effect로 기록되며 별도 조회 operation은 만들지 않는다.
- canonical_id: REQ-018
  status: screen-only
  evidence: 관리 화면 공통 UI 상태는 ui-design.md 화면 상태로 검증하고 API operation은 상태 데이터만 반환한다.
- canonical_id: REQ-020
  status: non-functional
  evidence: 상대경로 /api/...와 기술스택은 x-shared-contract-reference 및 frontend 검증 대상이다.
- canonical_id: REQ-023
  status: data-constraint
  evidence: 최소 데이터 도메인은 data-model.md의 table contract로 충족하며 단일 CRUD operation으로 대표하지 않는다.
- canonical_id: REQ-025
  status: screen-only
  evidence: LOGIN 및 9개 화면 목록은 ui-design.md screen inventory에서 추적한다.
- canonical_id: REQ-026
  status: non-functional
  evidence: Version BOM과 required_outputs는 x-shared-contract-reference에 보존되고 operation mapping 대상은 아니다.
- canonical_id: REQ-027
  status: non-functional
  evidence: imperative/blocking/MyBatis 선택은 plan.md marker와 backend 구현 제약이며 HTTP operation 하나로 대표하지 않는다.
servers:
- url: /
  description: frontend nginx reverse proxy relative base
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 서비스 상태
      tags:
      - foundation
      x-related-requirements:
      - REQ-024
      - REQ-028
      responses:
        '200':
          description: backend health ok
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        status:
                          type: string
                          enum:
                          - UP
        '500':
          description: backend health error
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ApiError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/auth/login:
    post:
      operationId: login
      summary: 관리자 로그인
      tags:
      - auth
      x-related-requirements:
      - REQ-021
      - REQ-022
      - REQ-024
      x-business-rules:
      - 아이디와 비밀번호는 모두 필수다
      - seed 관리자 admin/admin은 R09 역할 세션을 생성해야 한다
      - 잠긴 계정은 세션을 생성할 수 없다
      x-side-effects:
      - sessions row를 ACTIVE 상태로 저장한다
      - HttpOnly SameSite=Lax session cookie를 발급한다
      - users.updated_at은 로그인 성공으로 변경하지 않는다
      x-state-transitions:
      - no session -> ACTIVE session
      x-required-tests:
      - 'happy: admin/admin으로 로그인한다 -> sessions.status=ACTIVE row와 roles R09가 현재 사용자 조회에 보인다'
      - 'auth: 이미 권한 없는 익명 요청이라는 개념은 로그인 예외다 -> 잘못된 password는 401 응답을 반환한다'
      - 'validation: loginId가 빈 문자열이다 -> ApiError.fieldErrors에 loginId 오류가 포함된다'
      - 'business: account_status=LOCKED 계정으로 로그인한다 -> sessions row가 생성되지 않는다'
      - 'side-effect: 로그인 성공 후 sessions row가 존재한다 -> session_id가 follow-up GET /api/auth/me에서 읽힌다'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: login success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CurrentUser'
        '400':
          description: validation error
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ApiError'
  /api/auth/logout:
    post:
      operationId: logout
      summary: 세션 로그아웃
      tags:
      - auth
      security:
      - sessionCookie: []
      x-related-requirements:
      - REQ-022
      - REQ-024
      x-business-rules:
      - 유효한 ACTIVE session만 로그아웃할 수 있다
      - 로그아웃은 사용자 계정 또는 권한 row를 변경하지 않는다
      x-side-effects:
      - sessions.status를 REVOKED로 저장한다
      - session cookie 만료 헤더를 반환한다
      x-state-transitions:
      - ACTIVE session -> REVOKED session
      x-required-tests:
      - 'happy: ACTIVE session으로 로그아웃한다 -> sessions.status=REVOKED가 follow-up read에서 보인다'
      - 'auth: 세션 없는 요청으로 로그아웃한다 -> 401 응답을 반환한다'
      - 'validation: session cookie가 변조된 값이다 -> ApiError.code=UNAUTHORIZED가 반환된다'
      - 'business: 이미 REVOKED session으로 로그아웃한다 -> sessions.status가 REVOKED에서 바뀌지 않는다'
      - 'side-effect: 로그아웃 성공 후 Set-Cookie 만료 헤더가 존재한다 -> cookie Max-Age=0을 읽을 수 있다'
      responses:
        '200':
          description: logout success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        loggedOut:
                          type: boolean
        '401':
          description: no session
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ApiError'
      x-roles:
      - authenticated
