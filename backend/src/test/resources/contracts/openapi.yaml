x-business-rules:
- 모든 보호 API는 인증 세션을 요구한다
- 권한 없는 요청은 서버에서 401 또는 403으로 차단한다
- 기능 권한이 설정된 API는 역할별 기능권한을 추가로 검증한다
- 데이터 범위 권한이 적용되는 API는 서버 조회조건에 범위를 강제 적용한다
- 브라우저와 frontend는 상대경로 /api/...만 사용한다
