      type: string
      enum:
      - POSITION_BASED
      - MANUAL
    AssignmentStatus:
      type: string
      enum:
      - ACTIVE
      - REVOKED
      - EXPIRED
    SessionStatus:
      type: string
      enum:
      - ACTIVE
      - EXPIRED
      - REVOKED
    MenuLevel:
      type: string
      enum:
      - TOP
      - MIDDLE
      - SCREEN
    PrincipalType:
      type: string
      enum:
      - ROLE
      - ORGANIZATION
      - USER
    PermissionEffect:
      type: string
      enum:
