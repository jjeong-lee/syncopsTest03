      x-business-rules:
      - roleCodes는 존재하는 R01~R09만 허용한다
      - KORUS 원천정보는 역할 저장 대상이 아니다
      x-side-effects:
      - user_role_assignment를 요청 목록으로 대체한다
      - 회수된 역할은 REVOKED로 남긴다
