      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUsageRequest'
      x-business-rules:
      - KORUS snapshot 필드는 수정하지 않는다
      - system_use_yn은 Y 또는 N만 허용한다
      x-side-effects:
      - app_user.system_use_yn을 저장한다
      - change_history에 before/after/reason을 기록한다
      x-required-tests:
      - 'happy: 유효한 요청 -> app_user.system_use_yn 재조회 값이 요청 값과 일치한다'
      - 'auth: 세션 없는 사용자 -> 401 ApiError를 반환한다'
      - 'validation: systemUseYn=X -> 해당 fieldErrors 항목을 반환한다'
      - 'business: KORUS readonly 필드 변경 요청 차단 -> app_user 기존 상태가 변경되지 않는다'
      - 'side-effect: app_user change_history -> change_history 행이 생성된다'
      x-state-transitions:
      - ACTIVE -> INACTIVE
      x-roles:
      - authenticated
