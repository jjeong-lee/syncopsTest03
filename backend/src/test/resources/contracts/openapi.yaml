  /api/users/{userId}/administration:
    patch:
      operationId: updateUserAdministration
      summary: 사용자 사용여부 저장
      tags:
      - user
      security:
      - sessionCookie: []
      x-related-requirements:
      - REQ-001
      - REQ-015
      - REQ-016
      - REQ-019
      - REQ-024
      x-business-rules:
      - KORUS 원천 인사 항목은 requestBody에 포함되어도 저장하지 않는다
      - systemUseYn은 Y 또는 N만 허용한다
      - 업무 역할 변경은 존재하는 roleCode만 허용한다
      x-side-effects:
      - users.system_use_yn을 저장한다
      - user_roles row를 요청된 업무 역할 목록에 맞게 ACTIVE 또는 REVOKED로 조정한다
      - change_history에 users 변경 전후 값을 기록한다
      x-state-transitions:
      - users.account_status ACTIVE <-> INACTIVE
      - user_roles ACTIVE -> REVOKED when removed
      x-required-tests:
      - 'happy: R09 세션이 유효한 요청을 저장한다 -> users.system_use_yn 값이 follow-up read에서 변경되어 보인다'
      - 'auth: R01 교원 세션이 같은 요청을 보낸다 -> 403 응답과 ApiError.code=FORBIDDEN을 반환한다'
      - 'validation: systemUseYn=X -> ApiError.fieldErrors에 해당 field 오류가 포함된다'
      - 'business: KORUS staffName 수정 요청은 snapshot에 반영되면 안 된다 -> 대상 users row의 기존 상태가 유지된다'
      - 'side-effect: 저장 성공 후 change_history row가 entity_name=users 값을 가진다 -> history_id가 조회된다'
