      - 'business: 존재하지 않는 role_code 차단 -> user_role_assignment 기존 상태가 변경되지 않는다'
      - 'side-effect: user_role_assignment change_history -> change_history 행이 생성된다'
      x-state-transitions:
      - ACTIVE -> REVOKED
      - none -> ACTIVE
