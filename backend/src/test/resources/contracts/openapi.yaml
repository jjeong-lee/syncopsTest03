      - SessionCookieAuth: []
      x-business-rules:
      - 인증된 ACTIVE 세션만 로그아웃할 수 있다
      x-side-effects:
      - session.status를 LOGGED_OUT으로 저장한다
      - 세션 쿠키 만료 응답을 반환한다
      x-required-tests:
      - 'happy: R09 세션으로 logout 요청 성공 -> 후속 조회에서 session.status 변경값이 보인다'
      - 'auth: 비로그인 세션으로 logout 요청 -> HTTP 403을 반환한다'
      - 'validation: 세션 쿠키 누락 -> ApiError.fields에 해당 필드 오류가 포함된다'
      - 'business: linked requirement의 불변/범위 규칙 위반 -> session.status 기존 값이 유지된다'
      - 'side-effect: logout 성공 -> session.updated_at 또는 변경 사유 필드가 갱신된다'
      x-state-transitions:
      - ACTIVE -> LOGGED_OUT
      x-roles:
      - authenticated
