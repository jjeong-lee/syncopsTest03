                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CurrentUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-business-rules:
      - admin/admin seed 계정은 Docker Compose 직후 로그인 가능해야 한다
      - 성공 시 R09 역할과 9개 목표 메뉴 권한을 현재 사용자에 연결한다
      x-side-effects:
      - session 레코드를 ACTIVE 상태로 저장한다
      - HttpOnly SameSite=Lax 세션 쿠키를 발급한다
      x-required-tests:
      - 'happy: R09 세션으로 login 요청 성공 -> 후속 조회에서 session.status 변경값이 보인다'
      - 'auth: 비로그인 세션으로 login 요청 -> HTTP 403을 반환한다'
      - 'validation: username 또는 password 공백 -> ApiError.fields에 해당 필드 오류가 포함된다'
      - 'business: linked requirement의 불변/범위 규칙 위반 -> session.status 기존 값이 유지된다'
      - 'side-effect: login 성공 -> session.updated_at 또는 변경 사유 필드가 갱신된다'
      x-state-transitions:
      - 없음 -> ACTIVE
