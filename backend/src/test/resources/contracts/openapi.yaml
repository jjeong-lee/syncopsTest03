      - error
      properties:
        success:
          type: boolean
        data:
          nullable: true
        error:
          nullable: true
          $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    AppUserSystemUseYnEnum:
      type: string
      enum:
      - Y
      - N
    AppUserAccountStatusEnum:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - LOCKED
