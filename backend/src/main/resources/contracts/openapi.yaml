paths:
  /api/users:
    get:
      operationId: listUsers
      summary: 사용자 관리 목록 조회
      tags:
      - 사용자 관리
      security:
      - sessionCookie: []
      x-related-requirements:
      - REQ-001
      - REQ-002
      - REQ-004
      - REQ-269
      - REQ-205
      - REQ-210
      - REQ-211
      - REQ-229
      - REQ-231
      - REQ-238
      - REQ-301
      - REQ-302
      - REQ-303
      - REQ-309
      - REQ-357
      - REQ-369
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      - $ref: '#/components/parameters/KeywordParam'
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Entity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: saveUsers
      summary: 사용자 관리 저장
      tags:
      - 사용자 관리
      security:
      - sessionCookie: []
      x-related-requirements:
      - REQ-003
      - REQ-005
      - REQ-006
      - REQ-007
      - REQ-206
      - REQ-207
      - REQ-266
      - REQ-267
      - REQ-304
      - REQ-305
      - REQ-306
      - REQ-307
      - REQ-310
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Entity'
      x-business-rules:
      - 사용자 관리의 원문 제약과 권한을 서버에서 검증한다
      - 권한 없는 사용자는 사용자 관리 저장을 수행할 수 없다
      x-side-effects:
      - 사용자_계정 레코드를 MyBatis transaction 안에서 저장하거나 상태를 변경한다
      - 변경 전후 값과 처리자를 감사 가능한 이력으로 남긴다
      x-required-tests:
      - 'happy: 유효한 사용자 관리 저장 요청 -> 사용자_계정 follow-up 조회에서 변경 필드가 확인된다'
      - 'auth: 권한 없는 역할로 사용자 관리 저장 요청 -> 403이 반환되고 사용자_계정 row가 변경되지 않는다'
      - 'validation: 필수 식별자 누락 -> 해당 field error가 ApiError.details에 반환된다'
      - 'business: 원문 제약 위반 요청 -> 사용자_계정 기존 상태가 유지된다'
      - 'side-effect: 성공 저장 -> 감사/이력 row에서 처리자와 처리일시를 조회할 수 있다'
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
