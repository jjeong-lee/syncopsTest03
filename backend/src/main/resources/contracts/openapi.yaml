components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
      description: 0-base page number
    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        enum:
        - 20
        - 50
        - 100
      description: 목록 표시 건수
    KeywordParam:
      name: keyword
      in: query
      schema:
        type: string
      description: 공통 검색어
  responses:
    BadRequest:
      description: 검증 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Unauthorized:
      description: 인증 필요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
      required:
      - code
      - message
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data: {}
        error:
          $ref: '#/components/schemas/ApiError'
      required:
      - success
    LoginRequest:
      type: object
      properties:
        login_id:
          type: string
        password:
          type: string
      required:
      - login_id
      - password
    SessionUser:
      type: object
      properties:
        user_id:
          type: string
        login_id:
          type: string
        role_codes:
          type: array
          items:
