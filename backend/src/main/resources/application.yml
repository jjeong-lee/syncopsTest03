server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: faculty-assessment-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/faculty_assessment}
    username: ${SPRING_DATASOURCE_USERNAME:faculty_assessment}
    password: ${SPRING_DATASOURCE_PASSWORD:faculty_assessment}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

app:
  foundation:
    enabled: true
  auth:
    session:
      secure: false
