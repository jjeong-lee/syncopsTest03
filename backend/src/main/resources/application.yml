spring:
  application:
    name: faculty-performance-common
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/fpe}
    username: ${SPRING_DATASOURCE_USERNAME:fpe}
    password: ${SPRING_DATASOURCE_PASSWORD:fpe_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
