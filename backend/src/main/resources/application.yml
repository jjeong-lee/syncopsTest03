server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: faculty-assessment-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/faculty_assessment}
    username: ${SPRING_DATASOURCE_USERNAME:faculty_assessment}
    password: ${SPRING_DATASOURCE_PASSWORD:faculty_assessment}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

app:
  foundation:
    enabled: true
  auth:
    session:
      secure: false
  neis:
    school-info-url: ${NEIS_SCHOOL_INFO_URL:https://open.neis.go.kr/hub/schoolInfo}
    open-api-key: ${NEIS_OPEN_API_KEY:}
    connect-timeout-millis: ${NEIS_CONNECT_TIMEOUT_MILLIS:3000}
    read-timeout-millis: ${NEIS_READ_TIMEOUT_MILLIS:5000}
