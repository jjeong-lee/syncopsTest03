spring:
  application:
    name: faculty-performance-common
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/fpe}
    username: ${SPRING_DATASOURCE_USERNAME:fpe}
    password: ${SPRING_DATASOURCE_PASSWORD:fpe_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
