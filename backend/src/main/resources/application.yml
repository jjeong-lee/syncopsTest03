spring:
  application:
    name: faculty-performance-common-foundation
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/fpe_common}
    username: ${SPRING_DATASOURCE_USERNAME:fpe_app}
    password: ${SPRING_DATASOURCE_PASSWORD:fpe_app_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
app:
  attachment-storage-dir: ${APP_ATTACHMENT_STORAGE_DIR:/var/lib/fpe/attachments}
