spring:
  application:
    name: faculty-performance-common
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fpe_common}
    username: ${SPRING_DATASOURCE_USERNAME:fpe}
    password: ${SPRING_DATASOURCE_PASSWORD:fpe}
  flyway:
    enabled: true
    locations: classpath:db/migration
mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
app:
  session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
  session-hours: ${SESSION_HOURS:8}
