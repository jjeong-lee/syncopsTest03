spring:
  application:
    name: faculty-performance-common
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fpe}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:fpe}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:fpe-local}}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
mybatis:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    enabled-by-default: false
