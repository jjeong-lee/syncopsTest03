spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/faculty_eval}
    username: ${SPRING_DATASOURCE_USERNAME:faculty_eval}
    password: ${SPRING_DATASOURCE_PASSWORD:faculty_eval_pw}
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
server:
  port: 8080
app:
  session:
    cookie-secure: ${APP_SESSION_COOKIE_SECURE:false}
    ttl-hours: ${APP_SESSION_TTL_HOURS:8}
mybatis:
  configuration:
    map-underscore-to-camel-case: true
