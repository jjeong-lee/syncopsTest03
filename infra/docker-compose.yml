services:
  database:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: fpe_common
      POSTGRES_USER: fpe_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fpe_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpe_app -d fpe_common"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    image: fpe-common-backend:0.1.0
    build:
      context: ../backend
    pull_policy: build
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/fpe_common
      SPRING_DATASOURCE_USERNAME: fpe_app
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fpe_password}
      APP_ATTACHMENT_ROOT: /var/app/attachments
      APP_LOCAL_ADMIN_PASSWORD: ${APP_LOCAL_ADMIN_PASSWORD:-admin}
    volumes:
      - attachment-files:/var/app/attachments
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8080:8080"
  frontend:
    image: fpe-common-frontend:0.1.0
    build:
      context: ../frontend
    pull_policy: build
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
volumes:
  postgres-data:
  attachment-files:
