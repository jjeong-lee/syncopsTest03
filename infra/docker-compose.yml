services:
  database:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: faculty_eval
      POSTGRES_USER: faculty_eval
      POSTGRES_PASSWORD: faculty_eval_pw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faculty_eval -d faculty_eval"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - faculty_eval_pgdata:/var/lib/postgresql/data
  backend:
    image: faculty-eval-common-backend:0.1.0
    build:
      context: ../backend
    pull_policy: build
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/faculty_eval
      SPRING_DATASOURCE_USERNAME: faculty_eval
      SPRING_DATASOURCE_PASSWORD: faculty_eval_pw
      APP_SESSION_COOKIE_SECURE: "false"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "8080:8080"
  frontend:
    image: faculty-eval-common-frontend:0.1.0
    build:
      context: ../frontend
    pull_policy: build
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
volumes:
  faculty_eval_pgdata:
