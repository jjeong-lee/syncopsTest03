services:
  database:
    image: postgres:16.6-alpine
    pull_policy: if_not_present
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fpe}
      POSTGRES_USER: ${POSTGRES_USER:-fpe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fpe_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpe -d fpe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fpe-net]
  backend:
    image: knue-fpe-backend:latest
    pull_policy: build
    build:
      context: ../backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/fpe
      SPRING_DATASOURCE_USERNAME: fpe
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fpe_password}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fpe-net]
  frontend:
    image: knue-fpe-frontend:latest
    pull_policy: build
    build:
      context: ../frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fpe-net]
volumes:
  postgres-data:
networks:
  fpe-net:
