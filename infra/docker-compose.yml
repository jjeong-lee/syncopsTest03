services:
  database:
    image: postgres:16.2-alpine
    environment:
      POSTGRES_DB: fpe_common
      POSTGRES_USER: fpe_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fpe_app_password}
    volumes:
      - fpe-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpe_app -d fpe_common"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fpe-net

  backend:
    image: faculty-performance-common-backend:0.1.0
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      DB_URL: jdbc:postgresql://database:5432/fpe_common
      DB_USERNAME: fpe_app
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fpe_app_password}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - fpe-net

  frontend:
    image: faculty-performance-common-frontend:0.1.0
    build:
      context: ../frontend
      dockerfile: Dockerfile
    pull_policy: build
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - fpe-net

volumes:
  fpe-postgres-data:

networks:
  fpe-net:
    driver: bridge
