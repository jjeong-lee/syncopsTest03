services:
  database:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: fpe_common
      POSTGRES_USER: fpe_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fpe_app_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpe_app -d fpe_common"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: fpe-common-backend:0.1.0
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/fpe_common
      SPRING_DATASOURCE_USERNAME: fpe_app
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fpe_app_password}
      APP_ATTACHMENT_STORAGE_DIR: /var/lib/fpe/attachments
    volumes:
      - attachment-data:/var/lib/fpe/attachments
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    image: fpe-common-frontend:0.1.0
    build:
      context: ../frontend
      dockerfile: Dockerfile
    pull_policy: build
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q 교수업적평가"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  attachment-data:
