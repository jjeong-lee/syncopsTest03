services:
  database:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: faculty_assessment
      POSTGRES_USER: faculty_assessment
      POSTGRES_PASSWORD: faculty_assessment
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faculty_assessment -d faculty_assessment"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: faculty-assessment-backend:local
    pull_policy: build
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/faculty_assessment
      SPRING_DATASOURCE_USERNAME: faculty_assessment
      SPRING_DATASOURCE_PASSWORD: faculty_assessment
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: faculty-assessment-frontend:local
    pull_policy: build
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
