services:
  database:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: fpe_common
      POSTGRES_USER: fpe
      POSTGRES_PASSWORD: fpe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpe -d fpe_common"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - fpe_common_data:/var/lib/postgresql/data

  backend:
    image: fpe-common-backend:0.1.0
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/fpe_common
      SPRING_DATASOURCE_USERNAME: fpe
      SPRING_DATASOURCE_PASSWORD: fpe
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: fpe-common-frontend:0.1.0
    build:
      context: ../frontend
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  fpe_common_data:
